name: Package Versioning

on:
  push:
    branches:
      - main

env:
  BUN_VERSION: 'canary' # Set to specific version when linter is released
  PNPM_VERSION: '12'

permissions: {} # Reset permissions by default

# Avoid concurrent runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    name: '🔍 Select Changesets mode'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v7
        with:
          persist-credentials: false # Do not persist git credentials on disk

      - name: '🔧 Setup pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: '🔍 Select Changesets mode'
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    # Only runs when there are pending changesets to consume
    name: '🔢 Create package version pull request'
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v7
        with:
          persist-credentials: false # Do not persist git credentials on disk

      - name: '🔧 Setup pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: '🏗️  Version packages'
        id: version
        uses: changesets/action/version@v2
