name: Validate Changeset

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-changeset:
    name: Changeset Required
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changeset in PR
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          CHANGESET_FILE_COUNT=$(printf '%s\n' "$CHANGED_FILES" | grep -Ec '^\.changeset/[^/]+\.md$' || true)

          if [ "$CHANGESET_FILE_COUNT" -eq 0 ]; then
            echo "::error::Pull request requires a changeset file"
            echo ""
            echo "::group::Required Action"
            echo "Create a changeset before merging:"
            echo ""
            echo "  1. Run: bun run changeset"
            echo "  2. Select affected packages"
            echo "  3. Choose version bump type (major/minor/patch)"
            echo "  4. Write summary"
            echo "  5. Commit: .changeset/*.md"
            echo ""
            echo "See: CONTRIBUTING.md for details"
            echo "::endgroup::"
            exit 1
          fi

          echo "::info::Detected $CHANGESET_FILE_COUNT changeset file(s) in this PR."
          echo "::group::Changeset Details"
          echo "$CHANGED_FILES" | grep -E '^\.changeset/[^/]+\.md$'
          echo "----------------------------------------"
          echo "::endgroup::"
