name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - RC
          - Release

env:
  BUN_VERSION: 'canary' # Set to specific version when linter is released
  PNPM_VERSION: '12'

permissions: {} # Reset permissions by default

# Avoid concurrent runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  apply-mode:
    name: '✨ Apply Changesets mode'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v7

      - name: '🔧 Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: '📦 Install dependencies'
        run: bun ci

      - name: '🏷️ Apply release channel'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "${{ inputs.channel }}" = "RC" ] && [ ! -f .changeset/pre.json ]; then
            bun changeset pre enter rc
            git add .changeset
            git commit -m "chore: enter release candidate mode"
            git push
          elif [ "${{ inputs.channel }}" = "Release" ] && [ -f .changeset/pre.json ]; then
            bun changeset pre exit
            git add .changeset
            git commit -m "chore: enter release mode"
            git push
          else
            echo "Already in '${{ inputs.channel }}' mode, nothing to change."
          fi

  select-mode:
    name: '🔍 Select Changesets mode'
    needs: apply-mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v7
        with:
          persist-credentials: false # Do not persist git credentials on disk

      - name: '🔍 Select Changesets mode'
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: '🔢 Create package version pull request'
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v7
        with:
          persist-credentials: false # Do not persist git credentials on disk

      - name: '🏗️  Version packages'
        id: version
        uses: changesets/action/version@v2

  publish:
    name: '🚀 Publish packages to npm'
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: '📥 Checkout code'
        uses: actions/checkout@v7
        with:
          persist-credentials: false # Do not persist git credentials on disk

      - name: '🔧 Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: '📦 Install dependencies'
        run: bun ci

      - name: '🔧 Setup pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: '🚀 Publish packages'
        uses: changesets/action/publish@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}
          create-github-releases: ${{ inputs.channel == 'Release' }}
          script: pnpm exec changeset publish
