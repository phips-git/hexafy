name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - RC
          - RELEASE

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Enforce main branch
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Releases can only run from main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Enter prerelease mode (RC)
        if: inputs.channel == 'RC'
        run: |
          bun x changeset pre enter rc

      - name: Exit pre-release mode (RELEASE)
        if: inputs.channel == 'RELEASE'
        run: |
          bun x changeset pre exit

      - name: Create Release
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version: bun run changeset:version
          publish: bun run changeset:publish
          commit: 'chore(release): ${{ inputs.channel }} release'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
