name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - RC
          - Release

env:
  BUN_VERSION: 'canary' # Set to specific version when linter is released
  PNPM_VERSION: '12'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: '🚀 Release'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      id-token: write

    steps:
      - name: '🔒 Enforce main branch'
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::Releases can only run from main."
            exit 1
          fi

      - name: '📦 Checkout repository'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: '🔧 Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: '🔧 Setup pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: '📥 Install dependencies'
        run: bun ci

      - name: '📝 Enter pre-release mode (RC)'
        if: inputs.channel == 'RC'
        run: |
          bun x changeset pre enter rc

      - name: '🔓 Exit pre-release mode'
        if: inputs.channel == 'Release'
        run: |
          bun x changeset pre exit

      - name: '🚀 Create Release'
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm exec changeset version
          publish-script: |
            if [ "${{ inputs.channel }}" == "RC" ]; then
              pnpm exec changeset publish --tag rc
            else
              pnpm exec changeset publish
            fi
          commit-message: 'chore(release): ${{ inputs.channel }} release'
          create-github-releases: ${{ inputs.channel == 'Release' }}
        env:
          NPM_CONFIG_PROVENANCE: 'true'
