name: CI

on:
  pull_request:
    branches:
      - main

env:
  BUN_VERSION: 'canary' # Set to specific version when linter is released

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-checks:
    name: '✨ Quality Checks'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: '📦 Checkout repository'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: '🔧 Setup Bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: '📥 Install dependencies'
        run: bun ci

      - name: '🔍 Type check'
        run: bun run typecheck

      - name: '📝 Lint'
        run: bun run lint

      - name: '🧪 Test'
        run: bun run test

      - name: '🏗️ Build'
        run: bun run build
