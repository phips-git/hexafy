name: CI

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/.cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  validate-publishable:
    name: Validate Publishable Packages
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/.cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate with Changesets
        run: |
          echo "Checking changeset status..."
          changeset status --verbose || echo "No changesets found"

      - name: Dry-run publish
        run: |
          echo "Running dry-run on publishable packages..."
          for pkg in packages/*/; do
            if [ -f "$pkg/package.json" ]; then
              name=$(jq -r '.name' "$pkg/package.json" 2>/dev/null)
              private=$(jq -r '.private' "$pkg/package.json" 2>/dev/null)
              # Skip private packages and non-publishable ones
              if [ "$name" != "null" ] && [ "$private" = "false" ] && [[ ! "$name" =~ ^@hexafy/(typescript-config|eslint-config|example-domain)$ ]]; then
                echo "Dry-run: $name..."
                cd "$pkg"
                bun publish --dry-run || echo "⚠️  $name dry-run had issues"
                cd ../..
              fi
            fi
          done
