name: Comment Changesets PR Status

on:
  pull_request:
    branches:
      - main

permissions: {} # Reset permissions by default

# Avoid concurrent runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  pr-status:
    name: 🔍 Generate PR status
    if: github.event.pull_request.head.repo.full_name == github.repository && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-slim
    permissions:
      contents: read # To check out repository code
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: 🔍 Generate PR status
        id: pr-status
        uses: changesets/action/pr-status@v2

  pr-comment:
    name: 💬 Comment on PR
    needs: pr-status
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write # To create and update comments on PRs
    steps:
      - name: 💬 Comment on PR
        uses: changesets/action/pr-comment@v2
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
